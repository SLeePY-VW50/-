spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/lab_reservation_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: lab_app
    password: ${LAB_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
  data:
    redis:
      database: 15

app:
  wechat:
    app-id: wx-test-only
    app-secret: test-only-wechat-secret
    checkin-qr-secret: test-only-checkin-qr-secret-with-32-bytes
  clock:
    fixed-instant: 2026-10-24T08:00:00+08:00
    zone: Asia/Shanghai
  jwt:
    secret: test-only-jwt-secret-with-at-least-32-bytes
    expiration: 2h
  internal-token: local-ai-internal-token
  reservation:
    jobs:
      enabled: false
  schedule:
    worker:
      enabled: false
    genetic:
      population-size: 4
      generations: 5
  experiment:
    repeats: 2
    recovery:
      enabled: false
    genetic:
      population-size: 4
      generations: 5
  statistics:
    jobs:
      enabled: false
